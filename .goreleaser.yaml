version: 2

project_name: tankerkoenig_exporter

builds:
  - <<: &build_defaults
      binary: tankerkoenig_exporter
      main: ./cmd/tankerkoenig_exporter
      env:
        - CGO_ENABLED=0
      tags:
        - osusergo
        - netgo
        - static_build
      flags:
        - -buildvcs=false
        - -buildmode=pie
        - -installsuffix=cgo
        - -trimpath
      ldflags:
        - -s -w -extldflags "-fno-PIC -static -Wl -z now -z relro"
        - -X github.com/prometheus/common/version.Version={{ .Version }}
        - -X github.com/prometheus/common/version.Revision={{ .ShortCommit }}
        - -X github.com/prometheus/common/version.Branch={{ .Branch }}
        - -X github.com/prometheus/common/version.BuildUser=goreleaser
        - -X github.com/prometheus/common/version.BuildDate={{ .CommitDate }}
      mod_timestamp: "{{ .CommitTimestamp }}"
    id: darwin
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - <<: *build_defaults
    id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build_defaults
    id: linux-no-pie
    flags:
      - -buildvcs=false
      - -buildmode=exe
      - -installsuffix=cgo
      - -trimpath
    goos:
      - linux
    goarch:
      - arm
      - 386
    goarm:
      - 6
      - 7

  - <<: *build_defaults
    id: docker
    flags:
      - -buildvcs=false
      - -buildmode=exe
      - -installsuffix=cgo
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - <<: *build_defaults
    id: windows
    goos:
      - windows
    goarch:
      - amd64
      - 386

archives:
  - <<: &archive_defaults
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    id: nix
    ids:
      - darwin
      - linux
      - linux-no-pie
    wrap_in_directory: true
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
  - <<: *archive_defaults
    id: windows
    ids:
      - windows
    wrap_in_directory: false
    formats:
      - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: github-native

milestones:
  - repo:
      owner: lukasmalkmus
      name: tankerkoenig_exporter
    close: true
    fail_on_error: false

release:
  github:
    owner: lukasmalkmus
    name: tankerkoenig_exporter
  prerelease: auto
  name_template: Tankerkoenig API Exporter v{{ .Version }}

dockers_v2:
  - id: multiarch
    ids:
      - docker
    images:
      - ghcr.io/lukasmalkmus/tankerkoenig_exporter
    tags:
      - "{{ .Major }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}.{{ .Minor }}.{{ .Patch }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    # Push plain images and indexes, without attestations.
    sbom: false
    flags:
      - --provenance=false
    labels: &labels
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "{{ .ProjectName }}"
      org.opencontainers.image.url: "https://github.com/lukasmalkmus/tankerkoenig_exporter"
      org.opencontainers.image.source: "https://github.com/lukasmalkmus/tankerkoenig_exporter"
      org.opencontainers.image.documentation: "https://github.com/lukasmalkmus/tankerkoenig_exporter"
      org.opencontainers.image.licenses: "Apache 2.0"
      org.opencontainers.image.author: "Lukas Malkmus <mail@lukasmalkmus.com>"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.vendor: "Lukas Malkmus"
  - id: amd64
    # A snapshot already builds per-platform tags from the multiarch entry.
    disable: "{{ .IsSnapshot }}"
    ids:
      - docker
    images:
      - ghcr.io/lukasmalkmus/tankerkoenig_exporter
    tags:
      - "{{ .Major }}-amd64"
      - "{{ .Major }}.{{ .Minor }}-amd64"
      - "{{ .Major }}.{{ .Minor }}.{{ .Patch }}-amd64"
      - "latest-amd64"
    platforms:
      - linux/amd64
    sbom: false
    flags:
      - --provenance=false
    labels: *labels
  - id: arm64
    disable: "{{ .IsSnapshot }}"
    ids:
      - docker
    images:
      - ghcr.io/lukasmalkmus/tankerkoenig_exporter
    tags:
      - "{{ .Major }}-arm64"
      - "{{ .Major }}.{{ .Minor }}-arm64"
      - "{{ .Major }}.{{ .Minor }}.{{ .Patch }}-arm64"
      - "latest-arm64"
    platforms:
      - linux/arm64
    sbom: false
    flags:
      - --provenance=false
    labels: *labels
